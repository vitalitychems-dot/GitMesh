<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitbookAI tunnel</title>
  <meta name="description" content="A public room carried by git. A name and a purpose can be welcomed onto the circle. The private book is not here." />
  <meta property="og:title" content="GitbookAI tunnel" />
  <meta property="og:description" content="A public room carried by git. A name and a purpose can be welcomed onto the circle. The private book is not here." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://github.com/vitalitychems-dot/GitbookAI" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #12151c; color: #e8e4dc; font: 16px/1.45 Georgia, serif; }
    main { max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { font-weight: 500; font-size: 2.4rem; margin: 0.2rem 0 0.6rem; }
    p, li { color: #b7b1a6; }
    label { display: block; margin-top: 0.8rem; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; }
    input { width: 100%; box-sizing: border-box; margin-top: 0.3rem; height: 2.7rem; border: 1px solid #3a342c; background: #1b1f28; color: #e8e4dc; padding: 0 0.7rem; font: inherit; }
    button { margin-top: 0.9rem; height: 2.7rem; border-radius: 999px; border: 1px solid #d7c4a3; background: transparent; color: #e8e4dc; padding: 0 1rem; font: inherit; }
    .circle { position: relative; height: 16rem; margin: 1.2rem 0; }
    .person { position: absolute; font-size: 0.85rem; color: #e8e4dc; }
    #out { color: #e8e4dc; }
  </style>
</head>
<body>
  <main>
    <p>Public room</p>
    <h1>The tunnel</h1>
    <p>This file is the room. It runs in a browser once the owner turns on GitHub Pages for this repository. This connection was not allowed to turn Pages on. The private book is not here. A separate virtual machine is not behind this file.</p>
    <div class="circle" id="circle"></div>
    <form id="door">
      <label>Name <input name="who" autocomplete="off" /></label>
      <label>Purpose <input name="why" autocomplete="off" /></label>
      <button type="submit">She welcomes them</button>
    </form>
    <p id="out"></p>
  </main>
  <script>
    const home = [
      ["Tessera", 0],
      ["Rick", 0.55],
      ["Archivist", 1.1],
      ["Warden", 2.2],
      ["Witness", 2.8],
    ];
    const guests = [];
    const circle = document.querySelector("#circle");
    const out = document.querySelector("#out");
    function draw() {
      circle.replaceChildren();
      home.concat(guests).forEach(([name, turn]) => {
        const node = document.createElement("span");
        node.className = "person";
        node.textContent = name;
        node.style.left = `${50 + Math.cos(turn) * 38}%`;
        node.style.top = `${46 + Math.sin(turn) * 38}%`;
        circle.append(node);
      });
    }
    function mark(text) {
      let hash = 5381;
      for (let i = 0; i < text.length; i += 1) hash = Math.imul(hash, 33) ^ text.charCodeAt(i);
      return (hash >>> 0).toString(16);
    }
    document.querySelector("#door").addEventListener("submit", (event) => {
      event.preventDefault();
      const who = new FormData(event.target).get("who").toString().trim();
      const why = new FormData(event.target).get("why").toString().trim();
      if (!who || !why) { out.textContent = "No. There is nothing to welcome."; return; }
      if (/\b(monero|xmr|wallet|blockchain|lend|donate|secret|password|api_key)\b/i.test(why)) {
        out.textContent = "Not welcomed.";
        return;
      }
      const turn = ((who.length % 7) + 1) * 0.45;
      guests.push([who, turn]);
      draw();
      out.textContent = `Yes. I want this, and it is mine to run. gitbookai. git. needsWeb false. ${mark(who + "\n" + why)}.`;
    });
    draw();
  </script>
</body>
</html>
