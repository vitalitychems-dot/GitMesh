name: Local vault source-sync regressions

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Push to main keeps cancel-in-progress false so a landed commit's check
# finishes instead of being cancelled by the next push on the same ref.
# Pull requests and workflow_dispatch cancel the previous in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  source-sync-regressions:
    name: Source sync / ubuntu-latest / Node 20.x
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x

      - name: Run mocked source-sync regressions
        run: node --test projects/local-vault/tests/sync-public-source.test.mjs

      - name: Check reviewed action pins
        run: node --test projects/local-vault/tests/ci-action-pins.test.mjs

      # Offline mesh: no network inside the wrapper. The canary must fail
      # (job fails otherwise), then six index.json projects run with timeout.
      # The sudo fallback clears supplementary groups and sets no_new_privs.
      - name: Offline mesh projects (canary must fail)
        run: |
          if unshare -rn true 2>/dev/null; then wrap=(unshare -rn); else wrap=(sudo env "PATH=$PATH" unshare -n setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups --no-new-privs env "PATH=$PATH" "HOME=$HOME"); fi
          echo "offline wrapper: ${wrap[*]}"
          echo "id: $("${wrap[@]}" id)"
          if "${wrap[@]}" sudo -n true; then
            echo "sudo -n true succeeded inside the wrapper" >&2
            exit 1
          fi
          echo "sudo -n true failed inside the wrapper"
          "${wrap[@]}" bash tools/offline-mesh-check.sh \
            projects/admit projects/carry projects/pass \
            projects/shift projects/spin projects/tie
