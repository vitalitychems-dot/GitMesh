name: Local vault source-sync regressions

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Push to main keeps cancel-in-progress false so a landed commit's check
# finishes instead of being cancelled by the next push on the same ref.
# Pull requests and workflow_dispatch cancel the previous in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  source-sync-regressions:
    name: Source sync / ubuntu-latest / Node 20.x
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x

      - name: Run mocked source-sync regressions
        run: node --test projects/local-vault/tests/sync-public-source.test.mjs

      - name: Check reviewed action pins
        run: node --test projects/local-vault/tests/ci-action-pins.test.mjs

      # Net + mount namespace. Bind-remount the actions directory read-only
      # before setpriv, then the write probe must fail. An unprivileged userns
      # only maps uid 0 and rejects --clear-groups, so that branch drops caps
      # and says so. The sudo branch is unshare -n -m and drops to the runner uid.
      - name: Offline mesh projects (canary must fail)
        run: |
          uid=$(id -u); gid=$(id -g)
          actions_paths=()
          actions_real=()
          add_actions() {
            local spec="$1" p r seen
            [ -n "$spec" ] || return 0
            if ! p=$(ls -d "$spec" 2>/dev/null); then echo "absent: $spec"; return 0; fi
            r=$(realpath "$p")
            for seen in "${actions_real[@]+"${actions_real[@]}"}"; do [ "$seen" = "$r" ] && return 0; done
            actions_real+=("$r")
            actions_paths+=("$r")
          }
          if [ -n "${RUNNER_WORKSPACE:-}" ]; then add_actions "$RUNNER_WORKSPACE/../_actions"; fi
          add_actions "$HOME/work/_actions"
          if [ "${#actions_paths[@]}" -eq 0 ]; then
            echo "ro mount failed: no actions directory to remount read-only" >&2
            exit 1
          fi
          ACTIONS_RO_1=${actions_paths[0]}
          ACTIONS_RO_2=${actions_paths[1]:-}
          MODE=full
          if unshare -rnm true 2>/dev/null; then
            if ! unshare -rnm setpriv --reuid="$uid" --regid="$gid" --clear-groups --no-new-privs --inh-caps=-all --bounding-set=-all true 2>/dev/null; then
              echo "unprivileged userns: setpriv cannot --reuid to the host uid (only uid 0 is mapped) or --clear-groups (setgroups EPERM); using --no-new-privs --inh-caps=-all --bounding-set=-all"
              MODE=capdrop
            fi
            export MODE ACTIONS_RO_1 ACTIONS_RO_2 RUN_UID="$uid" RUN_GID="$gid" RUN_HOME="$HOME"
            ns=(unshare -rnm)
            echo "offline wrapper: unshare -rnm; mount --bind; mount -o remount,bind,ro; tmpfs /run/dbus /run/systemd/resolve; setpriv mode $MODE"
          else
            export MODE ACTIONS_RO_1 ACTIONS_RO_2 RUN_UID="$uid" RUN_GID="$gid" RUN_HOME="$HOME"
            ns=(sudo env "PATH=$PATH" "HOME=$HOME" "MODE=$MODE" "ACTIONS_RO_1=$ACTIONS_RO_1" "ACTIONS_RO_2=$ACTIONS_RO_2" "RUN_UID=$uid" "RUN_GID=$gid" "RUN_HOME=$HOME" unshare -n -m)
            echo "offline wrapper: sudo env PATH=\$PATH unshare -n -m; mount --bind; mount -o remount,bind,ro; tmpfs /run/dbus /run/systemd/resolve; setpriv --reuid=$uid --regid=$gid --clear-groups --no-new-privs --inh-caps=-all --bounding-set=-all"
          fi
          inner='
          set -e
          mount_one() {
            local d="$1" err
            [ -n "$d" ] || return 0
            if ! err=$(mount --bind "$d" "$d" 2>&1); then echo "ro mount failed: $d: bind: $err" >&2; exit 99; fi
            if ! err=$(mount -o remount,bind,ro "$d" 2>&1); then echo "ro mount failed: $d: remount,bind,ro: $err" >&2; exit 99; fi
          }
          hide_dir() {
            local d="$1" err
            [ -d "$d" ] || return 0
            if ! err=$(mount -t tmpfs -o nosuid,nodev,noexec,ro,mode=0555 tmpfs "$d" 2>&1); then echo "hide mount failed: $d: tmpfs: $err" >&2; exit 99; fi
          }
          mount_one "$ACTIONS_RO_1"
          mount_one "$ACTIONS_RO_2"
          hide_dir /run/dbus
          hide_dir /run/systemd/resolve
          if [ "$MODE" = capdrop ]; then
            exec setpriv --no-new-privs --inh-caps=-all --bounding-set=-all env "PATH=$PATH" "HOME=$RUN_HOME" "$@"
          fi
          exec setpriv --reuid="$RUN_UID" --regid="$RUN_GID" --clear-groups --no-new-privs --inh-caps=-all --bounding-set=-all env "PATH=$PATH" "HOME=$RUN_HOME" "$@"
          '
          wrap() {
            local ec=0
            "${ns[@]}" bash -c "$inner" bash "$@" || ec=$?
            if [ "$ec" -eq 99 ]; then exit 99; fi
            return "$ec"
          }
          echo "step: Offline mesh projects (canary must fail)"
          id_out=$(wrap id) || exit $?
          echo "id: $id_out"
          wrap grep -E '^Cap(Eff|Prm|Inh|Bnd):' /proc/self/status
          for d in "${actions_paths[@]}"; do
            opts=$(wrap findmnt -no OPTIONS --target "$d") || exit $?
            echo "actions mount: $d $opts"
            case "$opts" in
              ro|ro,*|*,ro|*,ro,*) ;;
              *) echo "ro mount failed: $d: mounted $opts" >&2; exit 1 ;;
            esac
          done
          fail_if_ok() {
            if wrap "$@"; then echo "$* succeeded inside the wrapper" >&2; exit 1; fi
            echo "$* failed inside the wrapper"
          }
          fail_if_ok sudo -n true
          fail_if_ok nsenter --net=/proc/1/ns/net true
          fail_if_ok sudo -n nsenter --net=/proc/1/ns/net true
          fail_if_ok curl -sS --max-time 3 --unix-socket /var/run/docker.sock http://d/_ping
          dns_bad=0
          dns_fail() {
            local name="$1" ec=0; shift
            if [ "$name" = resolvectl ] || [ "$name" = busctl ]; then
              wrap bash -c "command -v $name >/dev/null 2>&1" || ec=$?
              if [ "$ec" -ne 0 ]; then echo "skip: $name missing"; return 0; fi
            fi
            ec=0
            wrap "$@" || ec=$?
            echo "$name exit $ec"
            if [ "$ec" -eq 0 ]; then echo "$name succeeded inside the wrapper" >&2; dns_bad=1; fi
          }
          dns_fail resolvectl resolvectl query github.com
          dns_fail busctl busctl call org.freedesktop.resolve1 /org/freedesktop/resolve1 org.freedesktop.resolve1.Manager ResolveHostname isit 0 github.com 0 0
          dns_fail getent getent hosts github.com
          unix_bad=0
          unix_probe() {
            local path="$1" ec=0
            wrap test -e "$path" || ec=$?
            if [ "$ec" -ne 0 ]; then echo "absent: $path"; return 0; fi
            ec=0
            wrap bash -c 'command -v python3 >/dev/null 2>&1' || ec=$?
            if [ "$ec" -ne 0 ]; then echo "python3 missing inside the wrapper" >&2; unix_bad=1; return 0; fi
            ec=0
            wrap python3 -c 'import socket,sys; s=socket.socket(socket.AF_UNIX, socket.SOCK_STREAM); sys.exit(0 if s.connect_ex(sys.argv[1])==0 else 1)' "$path" || ec=$?
            echo "unix $path exit $ec"
            if [ "$ec" -eq 0 ]; then echo "unix $path connected inside the wrapper" >&2; unix_bad=1; fi
          }
          unix_probe /run/dbus/system_bus_socket
          unix_probe /run/systemd/resolve/io.systemd.Resolve
          for d in "${actions_paths[@]}"; do
            echo "actions dir probed: $d"
            fail_if_ok bash -c 'f=$(mktemp "$1/probe.XXXXXX") || exit 1; rm -f "$f"' bash "$d"
          done
          if [ "$dns_bad" -ne 0 ] || [ "$unix_bad" -ne 0 ]; then exit 1; fi
          wrap bash tools/offline-mesh-check.sh \
            projects/admit projects/carry projects/pass \
            projects/shift projects/spin projects/tie
