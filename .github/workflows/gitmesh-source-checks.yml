name: GitMesh source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    name: Validate source and security regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run security regression suite
        run: env -u GITHUB_TOKEN python3 gitmesh-template/tests/test_security_regressions.py

      - name: Check local source without GitHub access
        run: env -u GITHUB_TOKEN node gitmesh-template/sync-public-source.mjs --check-local
