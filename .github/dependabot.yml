# Proposals only. Follow ACTIONS.md; never auto-merge action upgrades.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/setup-node"
    commit-message:
      prefix: "ci"
